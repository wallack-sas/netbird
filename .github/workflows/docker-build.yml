name: Build and Push Netbird Images

on:
  push:
    branches:
      - 'release/*-wallack'

env:
  REGISTRY: ghcr.io
  # On force Node 24 pour supprimer les warnings et anticiper la coupure de juin
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: netbird-reverse-proxy
            dockerfile: ./proxy/Dockerfile.multistage
          - image_name: netbird-server
            dockerfile: ./combined/Dockerfile.multistage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ÉTAPE AJOUTÉE : Configure le moteur Buildx indispensable pour le cache GHA
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6 # Passage en v6 pour une meilleure compatibilité
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # On utilise le cache interne de GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max